# Statistic/gradle.properties
kotlin.code.style=official

# Gradle daemon / build performance
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Optional switches read by build.gradle.kts (can also be passed with -P on the CLI):
# statistic.staticCxx=ON      -> link libstdc++/libgcc statically into libstatslib.so
# statistic.csv=data/x.csv    -> file used by the run task
# statistic.staticCxx=OFF
# statistic.csv=data/sample.csv
